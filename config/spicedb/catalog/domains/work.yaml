# Work owns Work lifecycle plus the exact archived and share-link actions.
domain: work
description: Work lifecycle, archived editing, and share-link policy
actions:
  work:
    view: view
    edit: edit
    view_archived: view_archived
    edit_archived: edit_archived
    delete: delete
    publish: publish
    manage: manage
    manage_share_links: manage_share_links
lookup_permissions:
  work: [manage]
platform_actions:
  work:
    create: is_admin
    list: is_admin
definitions:
  work:
    relations:
      policy: [platform]
    permissions:
      - platform_admin
      - view
      - edit
      - view_archived
      - edit_archived
      - delete
      - publish
      - manage
      - manage_share_links
permission_expressions:
  work:
    platform_admin: policy->is_admin
    view: platform_admin
    edit: platform_admin
    view_archived: policy->is_author
    edit_archived: platform_admin
    delete: platform_admin
    publish: platform_admin
    manage: platform_admin
    manage_share_links: manage
