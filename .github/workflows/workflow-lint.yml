name: Workflow lint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "release-please-config.json"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows and release configuration
        run: |
          node --check .github/scripts/verify-published-package.cjs
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          if [ -f release-please-config.json ]; then
            jq empty release-please-config.json
          fi
      - name: Set up package registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@echovisionlab"
      - name: Read published package metadata
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node .github/scripts/verify-published-package.cjs packages/proto packages/event
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
