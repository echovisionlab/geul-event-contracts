name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The existing deployment bot maintains release PRs; this job owns releases only.
          skip-github-pull-request: true

  publish-packages:
    name: Publish GitHub Packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@echovisionlab"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build event package
        run: pnpm --filter @echovisionlab/geul-event build

      - name: Publish Protobuf package
        working-directory: packages/proto
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: Publish event package
        working-directory: packages/event
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: Verify published packages
        run: node .github/scripts/verify-published-package.cjs packages/proto packages/event
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
