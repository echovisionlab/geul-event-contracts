import "google/protobuf/timestamp.proto";

// ============================================================
// PGMQ Queue and PostgreSQL Signal Names (constants for reference)
// ============================================================
// Queues:
//   - og.generate: OG image generation jobs
//   - transcoder.audio: Audio transcoding events
//   - transcoder.video: Video transcoding events
//   - waveform.generate: Waveform sidecar generation events
//   - asset_optimizer.mesh: GLB mesh optimization events
//   - file.delete: S3 file deletion events
//   - email.send: Transactional email delivery
//   - email.auth: Authentication email delivery
//   - email.campaign: Materialized campaign delivery-run batches
//   - user.delete.identity: Run the complete permanent account-deletion lifecycle
//   - user.delete.avatar: Retire a deleted user's avatar binding and asset
//   - ai.metadata.generate: AI metadata generation work items
//   - translation.generate: Translation generation work items
//   - transcode.result: Authoritative transcoding terminal results
//   - waveform.result: Authoritative waveform terminal results
//   - mesh.optimization.result: Authoritative mesh optimization terminal results
//   - release.track_original_audio.projection: API-owned Release Track original-audio projection
//
// Reconstructable PostgreSQL signals:
//   - transcode.progress: Transcoding progress updates
//   - transcode.cancel: Transcoding cancellation requests
//   - waveform.progress: Waveform generation progress updates
//   - waveform.cancel: Waveform generation cancellation requests
//   - mesh.optimization.progress: Mesh optimization progress updates
//   - media.processing.lifecycle: Authoritative media lifecycle wake-ups
//   - og.lifecycle: OG image generation lifecycle notifications
//   - mail_adapter.changed: Mail adapter configuration changes
//   - content.updated: Debounced content/document update notifications
//   - file.ingest: File ingest lifecycle updates; protobuf type identifies the stage
//   - translation.lifecycle: Translation lifecycle notifications

