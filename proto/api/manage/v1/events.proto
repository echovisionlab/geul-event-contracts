message ContentUpdatedField {
  string path = 1;
  ContentUpdatedFieldKind kind = 2;
}

// content.updated PostgreSQL signal
// Emitted for an accepted content/document mutation.
message ContentUpdatedEvent {
  ContentEntityType entity_type = 1;
  string entity_id = 2;
  ContentUpdateSource source = 3;
  repeated ContentUpdatedField changed_fields = 4;
  // Current UUID revision of the accepted typed document. A source/shared
  // mutation advances it; a target-only mutation may carry the unchanged
  // current token and must keep document_state_changed false. Absent for
  // metadata-only signals outside document authoring.
  optional string document_revision = 5;
  // Distinct authenticated Members whose edits produced this persisted update.
  repeated string contributor_member_ids = 6;
  bool document_state_changed = 7;
  int64 timestamp_ms = 8;
  // Exact locale affected by a locale-owned authoring mutation. The entire
  // locale tuple is absent for non-locale updates. Presence requires
  // locale_exists presence in the same event.
  optional string locale = 9;
  // Exact post-mutation locale existence. Required when locale is present.
  // false means target deletion and forbids target_revision; true means an
  // existing source or target locale.
  optional bool locale_exists = 10;
  // Accepted exact non-source target token. Required for an existing target,
  // absent for source-locale writes and target deletion. Target-only mutations
  // must not masquerade as a source document revision change.
  optional string target_revision = 11;
}

// ============================================================
// Translation Events
// ============================================================

// translation.generate queue
message TranslationGenerateEvent {
  string job_id = 1;
}

// translation.lifecycle PostgreSQL signal status enum
enum TranslationLifecycleStatus {
  TRANSLATION_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  TRANSLATION_LIFECYCLE_STATUS_APPLIED = 1;
  TRANSLATION_LIFECYCLE_STATUS_FAILED = 2;
}

// translation.lifecycle terminal target refetch/failure signal
message TranslationLifecycleEvent {
  string job_id = 1;
  TranslationEntityType entity_type = 2;
  string entity_id = 3;
  string target_locale = 4;
  TranslationLifecycleStatus status = 5;
  int64 timestamp_ms = 6;
  TranslationFailureReason failure_reason = 7;
}

// Existing-account passwordless login. The identity authority's code credential
// must contain target_email at delivery time.
message AuthLoginRecipient {
  string identity_id = 1;
  string target_email = 2;
}

// Pre-identity passwordless registration. This context is accepted only from
// the authenticated internal courier and does not require newsletter state.
message AuthRegistrationRecipient {
  string target_email = 1;
}
