syntax = "proto3";

package api.manage.v1;

import "api/manage/v1/common.proto";
import "api/policy/v1/access.proto";
import "google/protobuf/timestamp.proto";

// Map theme variant (light/dark)
message MapThemeVariant {
  string id = 1;
  string background_color = 2;
  string water_color = 3;
  string land_color = 4;
  string road_color = 5;
  string building_fill_color = 6;
  bool building_stroke_enabled = 7;
  string building_stroke_color = 8;
  string callout_line_color = 9;
  string callout_text_color = 10;
  string callout_background_color = 11;
  string callout_description_color = 12;
  string attribution_color = 13;
  string label_text_color = 14;
  string cluster_color = 15;
  string cluster_hover_color = 16;
  string cluster_text_color = 17;
  string cluster_text_hover_color = 18;
  string callout_hover_line_color = 19;
  string callout_hover_text_color = 20;
  string callout_hover_description_color = 21;
  string callout_hover_background_color = 22;
}

// Map theme settings (non-variant settings)
message MapThemeSettings {
  double callout_scale = 1;
  int32 callout_offset_x = 2;
  int32 callout_offset_y = 3;
  repeated string callout_fields = 4;
  int32 attribution_font_size = 5;
  bool show_area_labels = 6;
  bool show_poi_labels = 7;
}

// Full map theme with variants
message MapTheme {
  string id = 1;
  string name = 2;
  MapThemeSettings settings = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  MapThemeVariant light_variant = 6; // Always the light scheme.
  MapThemeVariant dark_variant = 7; // Always the dark scheme.
  int64 revision = 8;
}

// Resolved theme config (for rendering)
message ResolvedMapTheme {
  string theme_id = 1;
  string scheme = 2;
  MapThemeSettings settings = 3;
  MapThemeVariant variant = 4;
}

// Variant input for creation. Its parent field determines the scheme.
message MapThemeVariantInput {
  string background_color = 1;
  string water_color = 2;
  string land_color = 3;
  string road_color = 4;
  string building_fill_color = 5;
  bool building_stroke_enabled = 6;
  string building_stroke_color = 7;
  string callout_line_color = 8;
  string callout_text_color = 9;
  string callout_background_color = 10;
  string callout_description_color = 11;
  string attribution_color = 12;
  string label_text_color = 13;
  string cluster_color = 14;
  string cluster_hover_color = 15;
  string cluster_text_color = 16;
  string cluster_text_hover_color = 17;
  string callout_hover_line_color = 18;
  string callout_hover_text_color = 19;
  string callout_hover_description_color = 20;
  string callout_hover_background_color = 21;
}

// Request/Response messages

message GetMapThemeRequest {
  string id = 1;
}

message ListMapThemesRequest {}

message ListMapThemesResponse {
  repeated MapTheme themes = 1;
  string default_map_theme_id = 2;
}

message ResolveMapThemeRequest {
  optional string theme_id = 1;
  string scheme = 2; // "light" or "dark"
}

message CreateMapThemeRequest {
  string name = 1;
  MapThemeSettings settings = 2;
  MapThemeVariantInput light_variant = 3; // Always creates the light scheme.
  MapThemeVariantInput dark_variant = 4; // Always creates the dark scheme.
}

message DeleteMapThemeRequest {
  string id = 1;
}

message CopyMapThemeRequest {
  string id = 1;
  string name = 2;
}

message SetDefaultMapThemeRequest {
  string theme_id = 1;
}

message SetDefaultMapThemeResponse {
  string default_map_theme_id = 1;
}

// MapTheme Service
service MapThemeService {
  // Authenticated editor selection and rendering
  rpc ListMapThemes(ListMapThemesRequest) returns (ListMapThemesResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc ResolveMapTheme(ResolveMapThemeRequest) returns (ResolvedMapTheme) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Admin
  rpc GetMapTheme(GetMapThemeRequest) returns (MapTheme) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc CreateMapTheme(CreateMapThemeRequest) returns (MapTheme) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc DeleteMapTheme(DeleteMapThemeRequest) returns (DeleteResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc CopyMapTheme(CopyMapThemeRequest) returns (MapTheme) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc SetDefaultMapTheme(SetDefaultMapThemeRequest) returns (SetDefaultMapThemeResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
}
