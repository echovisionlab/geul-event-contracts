syntax = "proto3";

package api.manage.v1;

import "api/common/v1/common.proto";
import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";
import "api/manage/v1/common.proto";
import "api/policy/v1/access.proto";
import "google/protobuf/timestamp.proto";

// Page status enum
enum PageStatus {
  PAGE_STATUS_UNSPECIFIED = 0;
  PAGE_STATUS_DRAFT = 1;
  PAGE_STATUS_PUBLISHED = 2;
}

message Page {
  string id = 1;
  string title = 2;
  optional string slug = 3;
  api.content.v1.PageDocument document = 4;
  string revision = 5;
  PageStatus status = 6;
  bool show_title = 7;
  optional google.protobuf.Timestamp published_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  // OG image key (S3 path with timestamp, e.g., og/page/{id}/{timestamp}.webp)
  optional api.common.v1.AssetRef og_asset = 11;
  optional string summary = 12;
  api.common.v1.DocumentLayout document_layout = 13;
  optional api.common.v1.MediaDelivery featured_image_delivery = 14;
  // Exact Block selector and active attachment captured with the document
  // snapshot, then hydrated with request-scoped delivery and download action.
  repeated api.content.v1.ContentBlockMediaItem block_media = 15;
  string source_locale = 16;
}

// Page for listing (without content)
message PageSummary {
  string id = 1;
  string title = 2;
  optional string slug = 3;
  PageStatus status = 4;
  bool show_title = 5;
  optional google.protobuf.Timestamp published_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_locale = 9;
}

// Request/Response messages

message GetPageRequest {
  string id = 1;
}

message GetPageBySlugRequest {
  string slug = 1;
}

message CheckPageSlugAvailableRequest {
  string slug = 1;
  optional string exclude_id = 2;
}

message CheckPageSlugAvailableResponse {
  bool available = 1;
}

message ListPagesAdminRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2;
  repeated api.common.v1.SortSpec sorts = 3;
}

message ListPagesAdminResponse {
  repeated PageSummary pages = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

message CreatePageRequest {
  string title = 1;
  optional string slug = 2;
  optional bool show_title = 3;
  optional string summary = 4;
  // Required initial source locale for the new Page.
  string source_locale = 5;
}

message UpdatePageRequest {
  string id = 1;
  optional string slug = 2;
  optional bool show_title = 3;
}

message DeletePageRequest {
  string id = 1;
}

message PublishPageRequest {
  string id = 1;
}

message UnpublishPageRequest {
  string id = 1;
}

message UpdatePageResponse {
  string id = 1;
  bool changed = 2;
  optional string slug = 3;
  bool show_title = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message PageLifecycleMutationResponse {
  string id = 1;
  bool changed = 2;
  PageStatus status = 3;
  optional google.protobuf.Timestamp published_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message SetPageFeaturedImageRequest {
  string page_id = 1;
  string file_id = 2;
}

message SetPageFeaturedImageResponse {
  optional string og_generation_run_id = 1;
  api.common.v1.MediaDelivery image_delivery = 2;
}

message DeletePageFeaturedImageRequest {
  string page_id = 1;
}

// Version history
message PageVersion {
  string id = 1;
  int32 version = 2;
  optional string title = 3;
  string canonical_hash = 4;
  google.protobuf.Timestamp created_at = 5;
  optional string summary = 6;
  repeated VersionContributor contributors = 7;
  string source_locale = 8;
}

message ListPageVersionsRequest {
  string page_id = 1;
  api.common.v1.PaginationRequest pagination = 2;
}

message ListPageVersionsResponse {
  repeated PageVersion versions = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

message RestorePageVersionRequest {
  string version_id = 1;
  string page_id = 2;
}

// Page Service
service PageService {
  // Read (authenticated - draft pages require admin)
  rpc GetPage(GetPageRequest) returns (Page) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc GetPageBySlug(GetPageBySlugRequest) returns (Page) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Admin
  rpc ListPagesAdmin(ListPagesAdminRequest) returns (ListPagesAdminResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc CreatePage(CreatePageRequest) returns (Page) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc UpdatePage(UpdatePageRequest) returns (UpdatePageResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc DeletePage(DeletePageRequest) returns (DeleteResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }

  // Publishing workflow
  rpc PublishPage(PublishPageRequest) returns (PageLifecycleMutationResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc UnpublishPage(UnpublishPageRequest) returns (PageLifecycleMutationResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }

  // Featured image management
  rpc SetPageFeaturedImage(SetPageFeaturedImageRequest) returns (SetPageFeaturedImageResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc DeletePageFeaturedImage(DeletePageFeaturedImageRequest) returns (OgAssetDeleteResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }

  // Utility
  rpc CheckPageSlugAvailable(CheckPageSlugAvailableRequest) returns (CheckPageSlugAvailableResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }

  // Version history
  rpc ListPageVersions(ListPageVersionsRequest) returns (ListPageVersionsResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc RestorePageVersion(RestorePageVersionRequest) returns (Page) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
}
