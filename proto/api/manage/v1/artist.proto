syntax = "proto3";

package api.manage.v1;

import "api/common/v1/common.proto";
import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";
import "api/manage/v1/common.proto";
// Artist entity
import "api/policy/v1/access.proto";
import "google/protobuf/timestamp.proto";

// Artist status enum
enum ArtistStatus {
  ARTIST_STATUS_UNSPECIFIED = 0;
  ARTIST_STATUS_DRAFT = 1;
  ARTIST_STATUS_PUBLISHED = 2;
}

enum ArtistParticipantRole {
  ARTIST_PARTICIPANT_ROLE_UNSPECIFIED = 0;
  ARTIST_PARTICIPANT_ROLE_OWNER = 1;
  ARTIST_PARTICIPANT_ROLE_MANAGER = 2;
}

enum ArtistAction {
  ARTIST_ACTION_UNSPECIFIED = 0;
  ARTIST_ACTION_EDIT = 1;
  ARTIST_ACTION_PUBLISH = 2;
  ARTIST_ACTION_UNPUBLISH = 3;
  ARTIST_ACTION_MANAGE_SHARE_LINKS = 4;
  ARTIST_ACTION_DELETE = 5;
  ARTIST_ACTION_MANAGE_PARTICIPANTS = 6;
  ARTIST_ACTION_REMOVE_OWNER = 7;
}

enum ArtistRelationDomain {
  ARTIST_RELATION_DOMAIN_UNSPECIFIED = 0;
  ARTIST_RELATION_DOMAIN_CHILD_ARTIST = 1;
  ARTIST_RELATION_DOMAIN_LABEL = 2;
  ARTIST_RELATION_DOMAIN_PROGRAM_EVENT = 3;
  ARTIST_RELATION_DOMAIN_RELEASE = 4;
  ARTIST_RELATION_DOMAIN_TRACK = 5;
  ARTIST_RELATION_DOMAIN_WORK = 6;
}

message ArtistImage {
  string file_id = 1;
  api.common.v1.AssetRef asset = 2;
  int32 sort_order = 3;
  bool primary = 4;
}

message Artist {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional string real_name = 4;
  api.content.v1.RichTextDocument document = 5;
  optional string country_code = 6;
  optional string website = 7;
  map<string, string> social_links = 8;
  string status = 9; // "draft" or "published"
  google.protobuf.Timestamp published_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional string parent_artist_id = 13;
  optional api.common.v1.AssetRef og_asset = 14;
  optional api.common.v1.AssetRef image_asset = 15;
  repeated ArtistImage images = 16;
  string revision = 17;
  string source_locale = 18;
}

// Artist with release count (for admin list)
message ArtistWithStats {
  Artist artist = 1;
  int32 release_count = 2;
}

// Request/Response messages

message GetArtistEditorDataRequest {
  string id = 1;
}

message GetArtistEditorDataResponse {
  Artist artist = 1;
  repeated string label_ids = 2;
  repeated ArtistAction allowed_actions = 3;
  string image_revision = 4;
}

message ListArtistsRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2;
  repeated api.common.v1.SortSpec sorts = 3;
}

message ListArtistsResponse {
  repeated Artist artists = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

message ListArtistsAdminRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2;
  repeated api.common.v1.SortSpec sorts = 3;
}

message ListArtistsAdminResponse {
  repeated ArtistWithStats artists = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

message CreateArtistRequest {
  string name = 1;
  optional string slug = 2;
  optional string real_name = 3;
  // Optional initial source document. When omitted, the Artist service creates an empty compact document atomically.
  api.content.v1.RichTextDocument document = 4;
  optional string country_code = 5;
  optional string website = 6;
  map<string, string> social_links = 7;
  optional string parent_artist_id = 8;
  // Required initial source locale for the new Artist.
  string source_locale = 9;
}

message DeleteArtistRequest {
  string id = 1;
  string expected_revision = 2;
}

message PreviewDeleteArtistRequest {
  string id = 1;
}

message ArtistDeletionImpact {
  ArtistRelationDomain domain = 1;
  string entity_id = 2;
  string label = 3;
  int32 relation_count = 4;
}

message PreviewDeleteArtistResponse {
  string revision = 1;
  int32 total_relation_count = 2;
  repeated ArtistDeletionImpact impacts = 3;
}

message PublishArtistRequest {
  string id = 1;
}

message UnpublishArtistRequest {
  string id = 1;
}

message ArtistLifecycleMutationResponse {
  string id = 1;
  bool changed = 2;
  ArtistStatus status = 3;
  optional google.protobuf.Timestamp published_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Artist image management

message SetArtistImageRequest {
  string artist_id = 1;
  string file_id = 2;
}

message SetArtistImageResponse {
  api.common.v1.AssetRef image_asset = 1;
  optional string og_generation_run_id = 2;
}

message DeleteArtistImageRequest {
  string artist_id = 1;
}

message SetArtistImagesRequest {
  string artist_id = 1;
  repeated string file_ids = 2;
  string expected_revision = 3;
}

message SetArtistImagesResponse {
  repeated ArtistImage images = 1;
  string revision = 2;
  optional string og_generation_run_id = 3;
}

// Owner and Manager are mutually exclusive durable roles for one Member and
// Artist. has_effective_authority is false when the Member has no active,
// onboarded Identity, while the durable attribution relation remains.
message ArtistParticipant {
  api.common.v1.MemberSummary member = 1;
  ArtistParticipantRole role = 2;
  google.protobuf.Timestamp created_at = 3;
  bool has_effective_authority = 4;
}

message ListArtistParticipantsRequest {
  string artist_id = 1;
}

message ListArtistParticipantsResponse {
  repeated ArtistParticipant participants = 1;
}

message SetArtistParticipantRequest {
  string artist_id = 1;
  string member_id = 2;
  ArtistParticipantRole role = 3;
}

message RemoveArtistParticipantRequest {
  string artist_id = 1;
  string member_id = 2;
}

// My artists (artists where the current Member is Owner or Manager)

message ListMyArtistsRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2;
  repeated api.common.v1.SortSpec sorts = 3;
}

message ListMyArtistsResponse {
  repeated Artist artists = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

// Slug check

message CheckArtistSlugAvailableRequest {
  string slug = 1;
  optional string exclude_artist_id = 2;
}

message CheckArtistSlugAvailableResponse {
  bool available = 1;
}

// Artist Service
service ArtistService {
  // Public (only published artists)
  rpc GetArtistEditorData(GetArtistEditorDataRequest) returns (GetArtistEditorDataResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc ListArtists(ListArtistsRequest) returns (ListArtistsResponse) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Admin
  rpc ListArtistsAdmin(ListArtistsAdminRequest) returns (ListArtistsAdminResponse) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc CreateArtist(CreateArtistRequest) returns (Artist) {
    option (api.policy.v1.access) = {role: ADMIN};
  }
  rpc DeleteArtist(DeleteArtistRequest) returns (DeleteResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc PreviewDeleteArtist(PreviewDeleteArtistRequest) returns (PreviewDeleteArtistResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc PublishArtist(PublishArtistRequest) returns (ArtistLifecycleMutationResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc UnpublishArtist(UnpublishArtistRequest) returns (ArtistLifecycleMutationResponse) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Image management (Admin or Manager)
  rpc SetArtistImage(SetArtistImageRequest) returns (SetArtistImageResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc DeleteArtistImage(DeleteArtistImageRequest) returns (OgAssetDeleteResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc SetArtistImages(SetArtistImagesRequest) returns (SetArtistImagesResponse) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Durable Owner and Manager assignment. The API enforces the exact action.
  rpc ListArtistParticipants(ListArtistParticipantsRequest) returns (ListArtistParticipantsResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc SetArtistParticipant(SetArtistParticipantRequest) returns (ArtistParticipant) {
    option (api.policy.v1.access) = {role: USER};
  }
  rpc RemoveArtistParticipant(RemoveArtistParticipantRequest) returns (DeleteResponse) {
    option (api.policy.v1.access) = {role: USER};
  }

  // My artists (current user's manageable artists)
  rpc ListMyArtists(ListMyArtistsRequest) returns (ListMyArtistsResponse) {
    option (api.policy.v1.access) = {role: USER};
  }

  // Utility
  rpc CheckArtistSlugAvailable(CheckArtistSlugAvailableRequest) returns (CheckArtistSlugAvailableResponse) {
    option (api.policy.v1.access) = {role: USER};
  }
}
