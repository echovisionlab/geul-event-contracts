syntax = "proto3";

package api.open.v1;

import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";
import "api/open/v1/translation.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

service TermsService {
  // Get returns the current policy, exact public history, or authorized
  // scheduled preview selected by the request.
  rpc Get(GetTermsRequest) returns (GetTermsResponse);
  rpc List(ListTermsRequest) returns (ListTermsResponse);
}

message GetTermsRequest {
  optional string id = 1;
  optional string share_token = 2;
  optional string share_password = 3;
}

message GetTermsResponse {
  optional Terms terms = 1;
  optional Terms scheduled = 2;
}

// Terms exposes the selected locale as a typed Block document. Rendered HTML
// and plain text are derived projections and are not public authoring state.
message Terms {
  string id = 1;
  int32 version = 2;
  string title = 3;
  api.content.v1.LocalizedRichTextDocument document = 4;
  string revision = 5;
  google.protobuf.Timestamp effective_from = 6;
  optional google.protobuf.Timestamp effective_until = 7;
  optional LocalizationInfo localization_info = 8;
  optional api.common.v1.AssetRef og_asset = 9;
}

message ListTermsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListTermsResponse {
  repeated TermsSummary items = 1;
  int32 total = 2;
}

message TermsSummary {
  string id = 1;
  int32 version = 2;
  string title = 3;
  google.protobuf.Timestamp effective_from = 4;
  google.protobuf.Timestamp effective_until = 5;
}
