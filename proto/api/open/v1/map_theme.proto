syntax = "proto3";

package api.open.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

// Map theme variant (light/dark)
message MapThemeVariant {
  string id = 1;
  string background_color = 2;
  string water_color = 3;
  string land_color = 4;
  string road_color = 5;
  string building_fill_color = 6;
  bool building_stroke_enabled = 7;
  string building_stroke_color = 8;
  string callout_line_color = 9;
  string callout_text_color = 10;
  string callout_background_color = 11;
  string callout_description_color = 12;
  string attribution_color = 13;
  string label_text_color = 14;
  string cluster_color = 15;
  string cluster_hover_color = 16;
  string cluster_text_color = 17;
  string cluster_text_hover_color = 18;
  string callout_hover_line_color = 19;
  string callout_hover_text_color = 20;
  string callout_hover_description_color = 21;
  string callout_hover_background_color = 22;
}

// Map theme settings
message MapThemeSettings {
  double callout_scale = 1;
  int32 callout_offset_x = 2;
  int32 callout_offset_y = 3;
  repeated string callout_fields = 4;
  int32 attribution_font_size = 5;
  bool show_area_labels = 6;
  bool show_poi_labels = 7;
}

// Full map theme with variants
message MapTheme {
  string id = 1;
  string name = 2;
  MapThemeSettings settings = 3;
  google.protobuf.Timestamp created_at = 4;
  MapThemeVariant light_variant = 5; // Always the light scheme.
  MapThemeVariant dark_variant = 6; // Always the dark scheme.
}

// Resolved theme config (for rendering)
message ResolvedMapTheme {
  string theme_id = 1;
  string scheme = 2;
  MapThemeSettings settings = 3;
  MapThemeVariant variant = 4;
}

// MapThemeService provides public access to map themes
service MapThemeService {
  // ResolveByIds preserves request order and duplicate IDs. Empty IDs are omitted.
  // Every non-empty requested ID yields one result; unknown or deleted IDs resolve
  // to the current site default Map Theme.
  rpc ResolveByIds(ResolveMapThemesByIdsRequest) returns (ResolveMapThemesByIdsResponse);

  // Resolve returns the resolved theme config for rendering
  rpc Resolve(ResolveMapThemeRequest) returns (ResolvedMapTheme);
}

message ResolveMapThemesByIdsRequest {
  repeated string requested_theme_ids = 1;
}

message ResolveMapThemeByIdResult {
  string requested_theme_id = 1;
  MapTheme theme = 2;
}

message ResolveMapThemesByIdsResponse {
  repeated ResolveMapThemeByIdResult results = 1;
}

message ResolveMapThemeRequest {
  optional string theme_id = 1;
  string scheme = 2;
}
