syntax = "proto3";

package api.open.v1;

import "api/common/v1/common.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

// CategoryService provides public access to categories
service CategoryService {
  // List returns all categories with post counts
  rpc List(ListCategoriesRequest) returns (ListCategoriesResponse);
}

message ListCategoriesRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2; // (none for now)
  repeated api.common.v1.SortSpec sorts = 3; // name, post_count
}

message ListCategoriesResponse {
  repeated Category categories = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

message Category {
  string id = 1;
  string name = 2;
  string slug = 3;
  optional string description = 4;
  int32 post_count = 5;
}
