syntax = "proto3";

package api.open.v1;

import "api/common/v1/common.proto";
import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";
import "api/open/v1/translation.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

// LabelService provides public label access
service LabelService {
  // List returns non-draft labels with filter support
  rpc List(ListLabelsRequest) returns (ListLabelsResponse);

  // Get retrieves a label by slug or ID
  // - Server tries slug first, then ID (same as Release/Work pattern)
  // - share_token allows access to draft labels
  // - Includes release and artist counts
  rpc Get(GetLabelRequest) returns (GetLabelResponse);
}

// === List ===

message ListLabelsRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2; // id, country_code, parent_label_id, published_at
  repeated api.common.v1.SortSpec sorts = 3; // name, published_at
}

message ListLabelsResponse {
  repeated LabelSummary labels = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

// === Get ===

message GetLabelRequest {
  string slug = 1; // slug or ID (server handles both)
  optional string share_token = 2;
  optional string share_password = 3;
}

message GetLabelResponse {
  optional Label label = 1;
}

// Label for Get - includes counts and shallow lists
// share_token can access drafts, so published_at is optional
message Label {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  api.content.v1.LocalizedRichTextDocument document = 4;
  optional string website = 5;
  optional string country_code = 6;
  map<string, string> social_links = 7;
  LabelStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp published_at = 11; // optional (share_token -> draft)
  optional api.common.v1.AssetRef og_asset = 12;

  // Counts
  int32 release_count = 13;
  int32 artist_count = 14;

  // Parent label (if sublabel)
  optional LabelSummary parent_label = 15;

  // Shallow lists (first 12 items for preview)
  repeated LabelArtist artists = 16;
  repeated LabelRelease releases = 17;
  optional LocalizationInfo localization_info = 18;
  optional api.common.v1.AssetRef image_light_asset = 19;
  optional api.common.v1.AssetRef image_dark_asset = 20;
  string revision = 21;
}

message LabelArtist {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional api.common.v1.AssetRef image_asset = 4;
}

message LabelRelease {
  string id = 1;
  string title = 2;
  optional string slug = 3;
  string type = 4; // album, ep, single, compilation
  optional google.protobuf.Timestamp release_date = 5;
  google.protobuf.Timestamp published_at = 6;
  repeated LabelReleaseArtist artists = 7;
  optional api.common.v1.AssetRef artwork_asset = 8;
}

message LabelReleaseArtist {
  string id = 1;
  string name = 2;
  optional string slug = 3;
}

// === Enums and Shared Messages ===

enum LabelStatus {
  LABEL_STATUS_UNSPECIFIED = 0;
  LABEL_STATUS_DRAFT = 1;
  LABEL_STATUS_PUBLISHED = 2;
}

message LabelSummary {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional string country_code = 4;
  optional google.protobuf.Timestamp published_at = 5; // for List (published only)
  optional api.common.v1.AssetRef og_asset = 6;
  optional api.common.v1.AssetRef image_light_asset = 7;
  optional api.common.v1.AssetRef image_dark_asset = 8;
  optional string website = 9;
}
