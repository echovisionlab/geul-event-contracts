syntax = "proto3";

package api.open.v1;

import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

enum PublicMediaEntityType {
  PUBLIC_MEDIA_ENTITY_TYPE_UNSPECIFIED = 0;
  PUBLIC_MEDIA_ENTITY_TYPE_POST = 1;
  PUBLIC_MEDIA_ENTITY_TYPE_PAGE = 2;
  PUBLIC_MEDIA_ENTITY_TYPE_WORK = 3;
  PUBLIC_MEDIA_ENTITY_TYPE_PROGRAM_EVENT = 4;
  PUBLIC_MEDIA_ENTITY_TYPE_RELEASE = 5;
}

enum FileDownloadAvailability {
  FILE_DOWNLOAD_AVAILABILITY_UNSPECIFIED = 0;
  FILE_DOWNLOAD_AVAILABILITY_AVAILABLE = 1;
  FILE_DOWNLOAD_AVAILABILITY_UNAVAILABLE = 2;
}

enum FileDownloadAction {
  FILE_DOWNLOAD_ACTION_UNSPECIFIED = 0;
  FILE_DOWNLOAD_ACTION_DOWNLOAD = 1;
  FILE_DOWNLOAD_ACTION_SIGN_IN = 2;
  FILE_DOWNLOAD_ACTION_NONE = 3;
}

message FileDownloadAccess {
  FileDownloadAvailability availability = 1;
  FileDownloadAction action = 2;
}

message AuthorizeDownloadRequest {
  PublicMediaEntityType entity_type = 1;
  string entity_id = 2;
  // Content owners require content_block. RELEASE requires track_id, and the
  // server verifies that the Track belongs to entity_id before resolving its
  // current original-audio File.
  oneof relation_target {
    api.content.v1.ContentBlockMediaSelector content_block = 3;
    string track_id = 4;
  }
}

message AuthorizeDownloadResponse {
  FileDownloadAccess access = 1;
  optional api.common.v1.ExpiringMediaRef download = 2;
}

service FileService {
  // Resolves the current File from owner + exact relation target, then permits
  // only a public owner or an authenticated fully-consistent SpiceDB view.
  // Draft ShareLink proof stays on the owning Get route and is never accepted
  // here; callers never supply a File ID.
  rpc AuthorizeDownload(AuthorizeDownloadRequest) returns (AuthorizeDownloadResponse);
}
