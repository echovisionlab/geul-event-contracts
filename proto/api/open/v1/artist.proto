syntax = "proto3";

package api.open.v1;

import "api/common/v1/common.proto";
import "api/common/v1/media.proto";
import "api/content/v1/block_content.proto";
import "api/open/v1/translation.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/open/v1;openv1";

// ArtistService provides public artist access
service ArtistService {
  // List returns non-draft artists with multi-sort and filter support
  rpc List(ListArtistsRequest) returns (ListArtistsResponse);

  // Get retrieves an artist by slug or ID
  // - Server tries slug first, then ID (same as Label/Release pattern)
  // - share_token allows access to draft artists
  // - Includes release and work counts
  rpc Get(GetArtistRequest) returns (GetArtistResponse);

  // GetReleases returns releases by an artist
  // - Only returns published releases
  rpc GetReleases(GetArtistReleasesRequest) returns (GetArtistReleasesResponse);

  // GetWorks returns works by an artist
  // - Only returns published works
  rpc GetWorks(GetArtistWorksRequest) returns (GetArtistWorksResponse);
}

// === Get ===

message GetArtistRequest {
  string slug = 1; // slug or ID (server handles both)
  optional string share_token = 2;
  optional string share_password = 3;
}

message GetArtistResponse {
  optional Artist artist = 1;
}

// Artist for Get - includes counts and labels
// share_token can access drafts, so published_at is optional
message Artist {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional string real_name = 4;
  api.content.v1.LocalizedRichTextDocument document = 5;
  optional string country_code = 6;
  optional string website = 7;
  map<string, string> social_links = 8;
  ArtistStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp published_at = 12; // optional (share_token -> draft)
  optional api.common.v1.AssetRef og_asset = 13;
  bool is_group = 14;

  // Counts
  int32 release_count = 15;
  int32 work_count = 16;

  // Labels (published only)
  repeated ArtistLabel labels = 17;
  optional LocalizationInfo localization_info = 18;
  optional api.common.v1.AssetRef image_asset = 19;
  repeated ArtistImage images = 20;
  string revision = 21;
}

message ArtistImage {
  string file_id = 1;
  api.common.v1.AssetRef asset = 2;
  int32 sort_order = 3;
  bool primary = 4;
}

// === GetReleases ===

message GetArtistReleasesRequest {
  string artist_id = 1;
  int32 limit = 2; // default 20
  optional int32 offset = 3;
  repeated api.common.v1.SortSpec sorts = 4; // title, release_date, published_at
}

message GetArtistReleasesResponse {
  repeated ArtistRelease releases = 1;
  int32 total = 2;
}

message ArtistRelease {
  string id = 1;
  string title = 2;
  optional string slug = 3;
  string type = 4; // album, ep, single, compilation
  optional google.protobuf.Timestamp release_date = 5;
  google.protobuf.Timestamp published_at = 6;
  repeated ArtistReleaseArtist artists = 7; // Other artists on the release
  optional api.common.v1.AssetRef artwork_asset = 8;
}

message ArtistReleaseArtist {
  string id = 1;
  string name = 2;
  optional string slug = 3;
}

// === List ===

message ListArtistsRequest {
  api.common.v1.PaginationRequest pagination = 1;
  repeated api.common.v1.FilterSpec filters = 2; // country_code, label_id, published_at
  repeated api.common.v1.SortSpec sorts = 3; // name, published_at
}

message ListArtistsResponse {
  repeated ArtistSummary artists = 1;
  api.common.v1.PaginationResponse pagination = 2;
}

// ArtistSummary for List - minimal info, no counts
// List only returns published items, so published_at is NOT optional
message ArtistSummary {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional string country_code = 4;
  google.protobuf.Timestamp published_at = 5; // NOT optional (List = published only)
  optional api.common.v1.AssetRef og_asset = 6;
  map<string, string> social_links = 7;
  optional api.common.v1.AssetRef image_asset = 8;
}

// === GetWorks ===

message GetArtistWorksRequest {
  string artist_id = 1;
  int32 limit = 2; // default 20
  optional int32 offset = 3;
  repeated api.common.v1.SortSpec sorts = 4; // title, published_at
}

message GetArtistWorksResponse {
  repeated ArtistWork works = 1;
  int32 total = 2;
}

message ArtistWork {
  string id = 1;
  string title = 2;
  optional string slug = 3;
  optional string summary = 4;
  google.protobuf.Timestamp published_at = 5;
  optional api.common.v1.AssetRef image_asset = 6;
}

// === Enums and Shared Messages ===

enum ArtistStatus {
  ARTIST_STATUS_UNSPECIFIED = 0;
  ARTIST_STATUS_DRAFT = 1;
  ARTIST_STATUS_PUBLISHED = 2;
}

message ArtistLabel {
  string id = 1;
  string name = 2;
  optional string slug = 3;
  optional api.common.v1.AssetRef image_asset = 4;
}
