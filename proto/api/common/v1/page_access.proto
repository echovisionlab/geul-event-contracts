syntax = "proto3";

package api.common.v1;

import "api/policy/v1/access.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/common/v1;commonv1";

// An absent policy or UNSPECIFIED mode grants public access.
// AUTHENTICATED requires a signed-in member without additional conditions.
// CONDITIONS requires a signed-in member who matches the selected groups.
enum PageAccessMode {
  PAGE_ACCESS_MODE_UNSPECIFIED = 0;
  PAGE_ACCESS_MODE_PUBLIC = 1;
  PAGE_ACCESS_MODE_AUTHENTICATED = 2;
  PAGE_ACCESS_MODE_CONDITIONS = 3;
}

// Joins the selected role, user tag, and newsletter condition groups.
enum PageAccessMatch {
  PAGE_ACCESS_MATCH_UNSPECIFIED = 0;
  PAGE_ACCESS_MATCH_ANY = 1;
  PAGE_ACCESS_MATCH_ALL = 2;
}

// Server-enforced Page audience conditions. CONDITIONS writes require at least
// one selected condition group. Authentication is a prerequisite, never an OR
// condition group. Billing conditions may be added when supported.
message PageAccessPolicy {
  PageAccessMode mode = 1;
  // AUTHOR and ADMIN are the only accepted roles on write. Any selected role
  // satisfies this group; the server evaluates the viewer's actual role.
  // USER is represented by AUTHENTICATED or CONDITIONS mode, not this list.
  repeated api.policy.v1.AuthorizationRole allowed_roles = 2;
  // Any selected user tag satisfies this group.
  repeated string user_tag_ids = 3;
  // When selected, active newsletter subscription is a condition group.
  bool newsletter_subscriber = 4;
  // ANY accepts one selected group; ALL requires every selected group.
  PageAccessMatch match = 5;
}

// Describes an access decision without revealing denied Page content or media.
enum PageAccessReason {
  PAGE_ACCESS_REASON_UNSPECIFIED = 0;
  PAGE_ACCESS_REASON_ALLOWED = 1;
  PAGE_ACCESS_REASON_AUTHENTICATION_REQUIRED = 2;
  PAGE_ACCESS_REASON_CONDITIONS_NOT_MET = 3;
}
