syntax = "proto3";

package api.intra.v1;

import "api/content/v1/block_content.proto";
import "api/intra/v1/collaboration.proto";
import "api/manage/v1/ai.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/intra/v1;intrav1";

// InternalPostService is the authoritative typed Block boundary for Post
// collaboration. Yjs remains collaboration runtime state and never crosses
// this durable API.
service InternalPostService {
  rpc LoadPostBlockDocument(LoadPostBlockDocumentRequest) returns (LoadPostBlockDocumentResponse);
  rpc ApplyPostBlockBatch(ApplyPostBlockBatchRequest) returns (ApplyPostBlockBatchResponse);
  rpc UpdatePostLocaleMetadata(UpdatePostLocaleMetadataRequest) returns (UpdatePostLocaleMetadataResponse);
  rpc UpdatePostDocumentMetadata(UpdatePostDocumentMetadataRequest) returns (UpdatePostDocumentMetadataResponse);
  rpc CreatePostVersionCheckpoint(CreatePostVersionCheckpointRequest) returns (CreatePostVersionCheckpointResponse);
}

message LoadPostBlockDocumentRequest {
  string post_id = 1;
  CollaborationPrincipal principal = 2;
  string locale = 3;
}

message LoadPostBlockDocumentResponse {
  // Exact room projection: shared/source base plus one complete materialized
  // requested-locale overlay. LocalizedRichTextDocument validates without
  // mislabeling a target overlay as the source overlay. Missing target values
  // are materialized from source fallback but locale_exists remains false and
  // Collab must not open a writable target room before explicit creation.
  api.content.v1.LocalizedRichTextDocument document = 1;
  // Persisted content_document.revision, hard-cut to mean only the
  // shared/source graph CAS. Target-only writes never advance it; source/shared
  // changes invalidate every target room.
  string document_revision = 2;
  repeated string category_ids = 3;
  repeated string tag_ids = 4;
  repeated api.content.v1.ContentBlockMediaItem block_media = 5;
  // Server-derived current source locale and its locale-owned metadata.
  PostLocaleMetadata source_metadata = 6;
  // Exact canonical locale requested by the caller.
  string locale = 7;
  // Presence of the exact requested locale resource, not lifecycle state.
  bool locale_exists = 8;
  // Present only when the exact requested locale exists. For a source room it
  // equals source_metadata; a missing target has no locale metadata message.
  optional PostLocaleMetadata locale_metadata = 9;
  // Present only for an existing non-source locale. It is an opaque token
  // derived from document_revision plus that exact locale row's updated_at:
  // source/shared change invalidates every target room; target-only change
  // advances only its locale. Source rooms and missing targets receive none.
  optional string target_revision = 10;
  // Exact persisted locale-owned leaf-terminal presence for the requested room
  // locale; never inferred from materialized/source-fallback values. Source and
  // target rooms report actual presence; a missing target reports an empty list.
  // Order is meaningless; producers emit canonical-sorted, duplicate-free
  // targets. relation_item, shared/topology/File, identity-terminal (row_id,
  // cell_id, Page unit_id), and composite object/list targets are forbidden.
  repeated api.manage.v1.AIDocumentFieldTarget present_locale_values = 11;
}

message PostLocaleMetadata {
  // Exact canonical locale owned by these values.
  string locale = 1;
  optional string title = 2;
  optional string summary = 3;
}

message PostNullableStringChange {
  oneof value {
    string set_value = 1;
    bool clear = 2;
  }
}

message PostStringIdList {
  repeated string ids = 1;
}

message ApplyPostBlockBatchRequest {
  string post_id = 1;
  // The batch expected_revision is the persisted content_document.revision,
  // hard-cut to observe only the shared/source graph.
  api.content.v1.RichTextBlockMutationBatch batch = 2;
  // Exact canonical room locale. The API rejects a mismatched room locale and
  // rejects structural operations outside the source locale with typed
  // CollaborationMutationRejectionDetail.
  string locale = 3;
  // Required for every non-source save and absent for source. A missing target
  // is rejected: Web/Collab must explicitly create and source-seed it through
  // AIDocument, commit, then reconnect/load the returned target token before
  // this save boundary becomes writable.
  optional string expected_target_revision = 4;
  // Actual changed locale-owned leaf terminals in this batch, including
  // explicit-empty writes and presence removal. Callers emit canonical-sorted,
  // duplicate-free targets. relation_item, shared/topology/File,
  // identity-terminal (row_id, cell_id, Page unit_id), and composite object/list
  // targets are forbidden. Source/shared-only batches send an empty list.
  repeated api.manage.v1.AIDocumentFieldTarget affected_locale_values = 5;
}

message ApplyPostBlockBatchResponse {
  // New shared/source graph token. It remains equal to the request token for a
  // target-only write; unrelated target locales never conflict.
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  // New target CAS after an accepted non-source create/value write. Absent for
  // source mutations and after target deletion.
  optional string target_revision = 6;
}

message UpdatePostLocaleMetadataRequest {
  string post_id = 1;
  PostNullableStringChange title_change = 2;
  PostNullableStringChange summary_change = 3;
  // Persisted content_document.revision observed by the caller, hard-cut to
  // change only for the shared/source graph.
  string expected_revision = 4;
  repeated string contributor_member_ids = 5;
  // Required canonical room locale. Non-source rooms may mutate only these
  // locale-owned fields and never Post structure or shared metadata.
  string locale = 6;
  // Required for every non-source save and absent for source. A missing target
  // is rejected until AIDocument explicit create commits its source seed and
  // the room reconnects with the returned target token.
  optional string expected_target_revision = 7;
}

message UpdatePostLocaleMetadataResponse {
  // New shared/source graph token. It remains equal to the request token for a
  // target-only write.
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  optional string target_revision = 6;
}

message UpdatePostDocumentMetadataRequest {
  string post_id = 1;
  PostStringIdList category_ids = 2;
  PostStringIdList tag_ids = 3;
  string expected_revision = 4;
  repeated string contributor_member_ids = 5;
  string locale = 6;
}

message UpdatePostDocumentMetadataResponse {
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  string locale = 4;
}

message CreatePostVersionCheckpointRequest {
  string post_id = 1;
  string expected_revision = 2;
  repeated string contributor_member_ids = 3;
  string locale = 4;
}

message CreatePostVersionCheckpointResponse {
  bool created = 1;
  optional string version_id = 2;
  string revision = 3;
  string locale = 4;
}
