syntax = "proto3";

package api.intra.v1;

import "api/content/v1/block_content.proto";
import "api/intra/v1/collaboration.proto";
import "api/manage/v1/ai.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/intra/v1;intrav1";

// InternalEmailTemplateService is the typed Block persistence boundary for the
// single document owned by an Email Template root. Layout HTML remains a
// separate typed field owned by Email Layout.
service InternalEmailTemplateService {
  rpc ApplyBlockBatch(ApplyEmailTemplateBlockBatchRequest) returns (ApplyEmailTemplateBlockBatchResponse);
  rpc UpdateEmailTemplateLocaleMetadata(UpdateEmailTemplateLocaleMetadataRequest) returns (UpdateEmailTemplateLocaleMetadataResponse);
  rpc LoadDocument(LoadEmailTemplateDocumentRequest) returns (LoadEmailTemplateDocumentResponse);
}

message ApplyEmailTemplateBlockBatchRequest {
  string email_template_id = 1;
  api.content.v1.RichTextBlockMutationBatch batch = 2;
  string locale = 3;
  // Required for a target locale and omitted for the source locale. Manual
  // collaboration only writes an existing target created by the AIDocument
  // lifecycle boundary.
  optional string expected_target_revision = 4;
  // Actual changed locale-owned leaf terminals in this batch, including
  // explicit-empty writes and presence removal. Callers emit canonical-sorted,
  // duplicate-free targets. relation_item, shared/topology/File,
  // identity-terminal (row_id, cell_id, Page unit_id), and composite object/list
  // targets are forbidden. Source/shared-only batches send an empty list.
  repeated api.manage.v1.AIDocumentFieldTarget affected_locale_values = 5;
}

message ApplyEmailTemplateBlockBatchResponse {
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  optional string target_revision = 6;
}

message UpdateEmailTemplateLocaleMetadataRequest {
  string email_template_id = 1;
  string expected_revision = 2;
  optional string subject = 3;
  repeated string contributor_member_ids = 4;
  // Required canonical room locale. A target locale must already exist.
  string locale = 5;
  // Required for a target locale and omitted for the source locale.
  optional string expected_target_revision = 6;
}

message UpdateEmailTemplateLocaleMetadataResponse {
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  optional string target_revision = 6;
}

message LoadEmailTemplateDocumentRequest {
  string email_template_id = 1;
  CollaborationPrincipal principal = 2;
  string locale = 3;
}

message EmailTemplateLocaleMetadata {
  // Canonical locale represented by this metadata projection.
  string locale = 1;
  optional string subject = 2;
}

message LoadEmailTemplateDocumentResponse {
  // Exact requested room projection. It contains the shared graph and one
  // complete locale overlay; it is never a target-only RichTextDocument.
  api.content.v1.LocalizedRichTextDocument document = 1;
  // Persisted content_document.revision. It advances only for source/shared
  // graph changes; target-only writes must not advance it.
  string document_revision = 2;
  // True source projection used for authority and fallback.
  EmailTemplateLocaleMetadata source_metadata = 3;
  string locale = 4;
  bool locale_exists = 5;
  // Present only when the exact requested locale exists.
  optional EmailTemplateLocaleMetadata locale_metadata = 6;
  // Present only for an existing non-source locale. Source/shared changes
  // invalidate every target token; target-only writes advance only this locale.
  optional string target_revision = 7;
  // Exact persisted locale-owned leaf-terminal presence for the requested room
  // locale; never inferred from materialized/source-fallback values. Source and
  // target rooms report actual presence; a missing target reports an empty list.
  // Order is meaningless; producers emit canonical-sorted, duplicate-free
  // targets. relation_item, shared/topology/File, identity-terminal (row_id,
  // cell_id, Page unit_id), and composite object/list targets are forbidden.
  repeated api.manage.v1.AIDocumentFieldTarget present_locale_values = 8;
}
