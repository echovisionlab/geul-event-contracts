syntax = "proto3";

package api.intra.v1;

import "api/content/v1/block_content.proto";
import "api/intra/v1/collaboration.proto";
import "api/manage/v1/ai.proto";

option go_package = "github.com/echovisionlab/geul-event-contracts/gen/api/intra/v1;intrav1";

// InternalProgramEventService is the typed Block persistence boundary for the
// one document owned by a Program Event.
service InternalProgramEventService {
  rpc LoadProgramEventBlockDocument(LoadProgramEventBlockDocumentRequest) returns (LoadProgramEventBlockDocumentResponse);
  rpc ApplyProgramEventBlockBatch(ApplyProgramEventBlockBatchRequest) returns (ApplyProgramEventBlockBatchResponse);
  rpc UpdateProgramEventLocaleMetadata(UpdateProgramEventLocaleMetadataRequest) returns (UpdateProgramEventLocaleMetadataResponse);
}

message ApplyProgramEventBlockBatchRequest {
  string event_id = 1;
  api.content.v1.RichTextBlockMutationBatch batch = 2;
  string locale = 3;
  // Required for every existing non-source save; absent for source. Missing
  // targets are rejected until explicit create commits and the room reconnects.
  optional string expected_target_revision = 4;
  // Actual changed locale-owned leaf terminals in this batch, including
  // explicit-empty writes and presence removal. Callers emit canonical-sorted,
  // duplicate-free targets. relation_item, shared/topology/File,
  // identity-terminal (row_id, cell_id, Page unit_id), and composite object/list
  // targets are forbidden. Source/shared-only batches send an empty list.
  repeated api.manage.v1.AIDocumentFieldTarget affected_locale_values = 5;
}

message ApplyProgramEventBlockBatchResponse {
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  optional string target_revision = 6;
}

message UpdateProgramEventLocaleMetadataRequest {
  string event_id = 1;
  optional string title = 2;
  NullableStringMutation summary = 3;
  string expected_revision = 4;
  repeated string contributor_member_ids = 5;
  // Exact canonical room locale. Existing non-source rooms may change only
  // these values; a missing target is not created by this RPC.
  string locale = 6;
  // Required for every existing non-source save; absent for source.
  optional string expected_target_revision = 7;
}

message UpdateProgramEventLocaleMetadataResponse {
  string document_revision = 1;
  bool changed = 2;
  bool source_changed = 3;
  repeated string changed_locales = 4;
  string locale = 5;
  optional string target_revision = 6;
}

message LoadProgramEventBlockDocumentRequest {
  string event_id = 1;
  CollaborationPrincipal principal = 2;
  string locale = 3;
}

message ProgramEventLocaleMetadata {
  reserved 4 to 5;
  reserved "content_html", "content_text";

  string locale = 1;
  optional string title = 2;
  optional string summary = 3;
}

message LoadProgramEventBlockDocumentResponse {
  api.content.v1.LocalizedRichTextDocument document = 1;
  // Persisted content_document.revision for the shared/source graph only.
  // Target-only writes must not advance it.
  string document_revision = 2;
  repeated api.content.v1.ContentBlockMediaItem block_media = 3;
  ProgramEventLocaleMetadata source_metadata = 4;
  string locale = 5;
  bool locale_exists = 6;
  optional ProgramEventLocaleMetadata locale_metadata = 7;
  optional string target_revision = 8;
  // Exact persisted locale-owned leaf-terminal presence for the requested room
  // locale; never inferred from materialized/source-fallback values. Source and
  // target rooms report actual presence; a missing target reports an empty list.
  // Order is meaningless; producers emit canonical-sorted, duplicate-free
  // targets. relation_item, shared/topology/File, identity-terminal (row_id,
  // cell_id, Page unit_id), and composite object/list targets are forbidden.
  repeated api.manage.v1.AIDocumentFieldTarget present_locale_values = 9;
}
